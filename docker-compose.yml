services:
  db:
    image: mysql:8.0
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloudmart
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql

  product-service:
    build: ./product-service
    ports:
      - "5001:5001"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: cloudmart
    depends_on:
      - db

  user-service:
    build: ./user-service
    ports:
      - "5000:5000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: cloudmart
    depends_on:
      - db
  order-service:
     build: ./order-service
     ports:
       - "5002:5002"
     environment:
       PYTHONBUFFERED: "1"
       DB_HOST: db
       DB_USER: root
       DB_PASSWORD: rootpassword
       DB_DATABASE: cloudmart
     depends_on:
       - db
     deploy:
       resources:
         limits:
           memory: 256M
  frontend:
     build: ./frontend
     ports:
       - "8080:80"
     depends_on:
       - product-service
       - user-service
       - order-service

volumes:
  db_data:

