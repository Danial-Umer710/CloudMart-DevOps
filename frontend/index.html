<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMart | AWS Migration Ready</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar { background-color: #232f3e; }
        .product-card { border: none; border-radius: 10px; transition: 0.3s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .placeholder-img { height: 150px; background: #e9ecef; display: flex; align-items: center; justify-content: center; border-radius: 10px 10px 0 0; font-size: 3rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">☁️ CloudMart Ops</a>
            <span class="badge bg-primary">Local Dev Mode</span>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Internal Inventory (8 Items)</h2>
        <div id="products-list" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary"></div>
                <p>Connecting to Microservices...</p>
            </div>
        </div>
    </div>

    <script>
        // 1. Load Products
        fetch('http://13.49.46.219/products')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('products-list');
                list.innerHTML = data.map(p => `
                    <div class="col-md-3">
                        <div class="card h-100 product-card shadow-sm">
                            <div class="placeholder-img">📦</div>
                            <div class="card-body d-flex flex-column">
                                <h6 class="fw-bold">${p.name}</h6>
                                <p class="text-muted small flex-grow-1">${p.description}</p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <span class="fw-bold text-success">$${p.price}</span>
                                    <button class="btn btn-dark btn-sm" onclick="buyProduct(${p.id})">Order</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('products-list').innerHTML = `<div class="alert alert-danger">Product Service (5001) Offline</div>`;
            });

        // 2. Order Logic
        function buyProduct(productId) {
            fetch('http://13.49.46.219:8080/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: 1, product_id: productId, quantity: 1, total_price: 10.0 })
            })
            .then(res => {
                if (!res.ok) throw new Error('Order Service returned error');
                return res.json();
            })
            .then(data => alert('✅ Success! Order ID: ' + data.order_id))
            .catch(err => alert('❌ Error: Order Service (Port 5002) is unreachable.\n\nCheck "docker ps" to see if order-service is Up.'));
        }
    </script>
</body>
</html>
