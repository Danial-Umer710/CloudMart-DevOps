<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMart | DevOps Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-purple: #6c5ce7;
            --dark-bg: #0f0f1a;
            --card-bg: #161b22;
            --text-main: #e6edf3;
        }

        body { 
            background-color: var(--dark-bg); 
            color: var(--text-main); 
            font-family: 'Inter', sans-serif;
            margin: 0;
        }

        /* Glassmorphism Navbar */
        .navbar { 
            background: rgba(15, 15, 26, 0.8) !important;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 0;
        }

        .navbar-brand { font-weight: 800; letter-spacing: -1px; }
        .navbar-brand span { color: var(--primary-purple); }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%);
            padding: 80px 0;
            text-align: center;
            border-radius: 0 0 40px 40px;
            margin-bottom: 50px;
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.3);
        }

        .hero h1 { font-weight: 800; font-size: 3.5rem; }

        /* Modern Product Cards */
        .product-card { 
            background-color: var(--card-bg); 
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .product-card:hover { 
            transform: translateY(-10px); 
            border-color: var(--primary-purple);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-img-container {
            height: 180px;
            background: #21262d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }

        .btn-buy {
            background-color: var(--primary-purple);
            border: none;
            border-radius: 12px;
            font-weight: 600;
            padding: 10px;
            transition: 0.2s;
        }

        .btn-buy:hover { background-color: #5b4cc4; color: white; }
        
        .price { font-size: 1.25rem; font-weight: 800; color: #50fa7b; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fs-3" href="#">☁️ CLOUD<span>MART</span></a>
            <span class="badge rounded-pill bg-primary px-3 py-2">K8S CLUSTER LIVE</span>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1>Premium Tech Inventory</h1>
            <p class="lead opacity-75">Securely served via Kubernetes Microservices</p>
        </div>
    </header>

    <div class="container mb-5">
        <div id="products-list" class="row g-4">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div>
                <p class="mt-3 text-secondary">Polling Backend Services...</p>
            </div>
        </div>
    </div>

    <script>
        // --- SCRIPT SECTION (UNTOUCHED LOGIC) ---
        fetch('http://localhost:5001/products')
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('products-list');
                list.innerHTML = data.map(p => `
                    <div class="col-md-4 col-lg-3">
                        <div class="card h-100 product-card">
                            <div class="card-img-container">📦</div>
                            <div class="card-body d-flex flex-column">
                                <h5 class="fw-bold mb-1">${p.name}</h5>
                                <p class="text-secondary small flex-grow-1">${p.description}</p>
                                <div class="d-flex justify-content-between align-items-center mt-3">
                                    <span class="price">$${p.price}</span>
                                    <button class="btn btn-primary btn-buy px-3" onclick="buyProduct(${p.id})">Order</button>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            })
            .catch(err => {
                document.getElementById('products-list').innerHTML = 
                `<div class="col-12"><div class="alert alert-danger border-0 bg-danger bg-opacity-10 text-danger text-center">
                    <b>Backend Offline:</b> Product Service (Port 5001) unreachable.
                </div></div>`;
            });

        function buyProduct(productId) {
            fetch('http://localhost:5002/orders', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: 1, product_id: productId, quantity: 1, total_price: 10.0 })
            })
            .then(res => {
                if (!res.ok) throw new Error('Order Service Error');
                return res.json();
            })
            .then(data => alert('🚀 MISSION SUCCESS!\n\nOrder ID #' + data.order_id + ' has been committed to the database.'))
            .catch(err => alert('❌ CONNECTION FAILED\n\nEnsure your Port-Forward for 5002 is still active in the terminal.'));
        }
    </script>
</body>
</html>
