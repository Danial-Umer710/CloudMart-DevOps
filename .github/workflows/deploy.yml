name: Deploy CloudMart Services

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push All Images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          # Stamps the EC2 IP into the Frontend so it knows where the API lives
          REACT_APP_API_URL: http://${{ secrets.EC2_PUBLIC_IP }}:5001
        run: |
          # 1. Frontend
          docker build -t $ECR_REGISTRY/cloudmart-frontend:latest \
            --build-arg REACT_APP_API_URL=$REACT_APP_API_URL \
            -f frontend/Dockerfile ./frontend
          docker push $ECR_REGISTRY/cloudmart-frontend:latest
          
          # 2. Product Service
          docker build -t $ECR_REGISTRY/cloudmart-product-service:latest -f product-service/Dockerfile ./product-service
          docker push $ECR_REGISTRY/cloudmart-product-service:latest
          
          # 3. Order Service
          docker build -t $ECR_REGISTRY/cloudmart-order-service:latest -f order-service/Dockerfile ./order-service
          docker push $ECR_REGISTRY/cloudmart-order-service:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Define Variables
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"
            REGION="${{ secrets.AWS_REGION }}"
            
            # Login to ECR on the EC2 server
            aws ecr get-login-password --region $REGION | sudo docker login --username AWS --password-stdin $REGISTRY
            
            # --- UPDATE PRODUCT SERVICE ---
            sudo docker pull $REGISTRY/cloudmart-product-service:latest
            sudo docker rm -f product-service || true
            sudo docker run -d --name product-service \
              -p 5001:5001 \
              --network cloudmart-network \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=cloudmart \
              $REGISTRY/cloudmart-product-service:latest

            # --- UPDATE ORDER SERVICE ---
            sudo docker pull $REGISTRY/cloudmart-order-service:latest
            sudo docker rm -f order-service || true
            sudo docker run -d --name order-service \
              -p 8080:8080 \
              --network cloudmart-network \
              -e DB_HOST=${{ secrets.DB_HOST }} \
              -e DB_USER=${{ secrets.DB_USER }} \
              -e DB_PASSWORD=${{ secrets.DB_PASSWORD }} \
              -e DB_NAME=cloudmart \
              $REGISTRY/cloudmart-order-service:latest

            # --- UPDATE FRONTEND ---
            sudo docker pull $REGISTRY/cloudmart-frontend:latest
            sudo docker rm -f frontend || true
            sudo docker run -d -p 3000:80 \
              --name frontend \
              --network cloudmart-network \
              $REGISTRY/cloudmart-frontend:latest

            # Cleanup: Deletes old images to keep your disk from getting full again
            sudo docker image prune -f
