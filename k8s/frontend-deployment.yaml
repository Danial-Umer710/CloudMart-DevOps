apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: cloudmart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: cloudmart-frontend:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
        env:
        # We point these to localhost because the code runs in YOUR browser
        - name: REACT_APP_PRODUCT_SERVICE_URL
          value: "http://localhost:5001"
        - name: REACT_APP_USER_SERVICE_URL
          value: "http://localhost:5000"
        - name: REACT_APP_ORDER_SERVICE_URL
          value: "http://localhost:5002"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: cloudmart
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30001
